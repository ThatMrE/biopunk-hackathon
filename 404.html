<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Specimen not found · Biopunk Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>☣</text></svg>">
<style>
  /* self-contained so it renders at any path */
  :root{--acid:#b8f21a}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#080a05;color:#e6e9da;font-family:"JetBrains Mono",ui-monospace,monospace;
    display:grid;place-items:center;text-align:center;padding:24px;overflow:hidden;position:relative}
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background:radial-gradient(60vw 55vw at 70% -10%,rgba(184,242,26,.12),transparent 60%),
      radial-gradient(45vw 45vw at 10% 110%,rgba(201,33,93,.08),transparent 60%)}
  .code{font-family:"Bungee",Impact,sans-serif;font-size:clamp(4rem,20vw,11rem);line-height:.9;color:var(--acid);
    text-shadow:0 0 40px rgba(184,242,26,.4)}
  .tag{display:inline-block;background:var(--acid);color:#0a0d05;padding:5px 12px;border-radius:2px;
    font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:22px}
  h1{font-family:"Bungee",sans-serif;text-transform:uppercase;font-size:clamp(1.1rem,4vw,1.8rem);margin:6px 0 12px}
  p{color:#aeb69d;max-width:440px;margin:0 auto 26px;font-size:.92rem;line-height:1.6}
  a{display:inline-block;background:var(--acid);color:#0a0d05;text-decoration:none;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;padding:13px 22px;border-radius:3px;
    box-shadow:0 0 30px -6px rgba(184,242,26,.5)}
  a:hover{background:#ccff45}
  .sig{margin-top:30px;color:#767f65;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
  <div>
    <span class="tag">Error // 404</span>
    <div class="code">404</div>
    <h1>Specimen not found</h1>
    <p>This sample mutated beyond recognition, or it never existed in the gene pool. Let's get you back to the lab.</p>
    <a href="/">← Back to base</a>
    <div class="sig">Biopunk Lab — all organisms reserved</div>
  </div>
</body>
</html>
